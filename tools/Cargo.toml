[package]
name = "tokenscope-verification"
version = "0.5.16"
edition = "2021"
publish = false
autobins = false

[[bin]]
name = "verify"
path = "src/verify.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[[bin]]
name = "ingest_benchmark"
path = "src/ingest_benchmark.rs"

[dependencies]
tokenscope_lib = { package = "tokenscope", path = "../src-tauri" }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
chrono = "0.4"
